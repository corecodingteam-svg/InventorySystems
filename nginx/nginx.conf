events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend_api {
        server backend:3000;
    }

    upstream web_app {
        server web:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_api/health;
        }

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
        }
    }

    # HTTPS: once a certificate is provisioned (e.g. certbot) under ./nginx/certs,
    # add a second `server { listen 443 ssl; ... }` block mirroring the above and
    # redirect port 80 to it. Kept out of the default config so first boot works
    # without a certificate.
}
