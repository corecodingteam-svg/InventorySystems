# Production stack for advaitamaa.com
#   advaitamaa.com            -> marketing website
#   inventory.advaitamaa.com  -> inventory web app + API
# Run from this folder:  docker compose --env-file .env up -d --build
name: advaitamaa

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - inventory-web
      - backend

  website:
    build: ../nexora-website
    restart: unless-stopped

  inventory-web:
    build:
      context: ../flutter_app
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: https://inventory.advaitamaa.com/api/v1
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: applies database migrations on every deploy.
  migrate:
    build:
      context: ../backend
      target: production
    restart: 'no'
    working_dir: /app
    command: ['npx', 'node-pg-migrate', 'up', '-m', '/database/migrations', '-j', 'js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../database/migrations:/database/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-off (profile "tools"): creates the first organisation + admin. Run by setup.sh.
  create-admin:
    profiles: ['tools']
    build:
      context: ../backend
      target: dev
    restart: 'no'
    command: ['npx', 'ts-node', '-r', 'tsconfig-paths/register', 'src/database/create-admin.ts']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ORG_NAME: ${ORG_NAME:-Advaitamaa}
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
